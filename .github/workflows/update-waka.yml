name: Update WakaTime Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never run two updates at once: the action commits to the README, so
# overlapping runs would race on the same file.
concurrency:
  group: waka-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate WakaTime Stats
        uses: yonela-johannes/waka-readme-stats@main
        with:
          wakatime_api_key: ${{ secrets.WAKATIME_API_KEY }}
          github_token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          github_repository: ${{ github.repository }}
          readme_path: README.md
          stats_range: last_7_days
          timezone: Africa/Johannesburg 
          languages_limit: 6
          languages_source: both
          show_code_time: "false"
          show_ai_time: "false"
          show_languages: "true"
          show_editors: "false"
          show_os: "false"
          show_projects: "false"
