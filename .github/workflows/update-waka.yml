name: Update WakaTime Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: waka-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate WakaTime Stats
        uses: yonela-johannes/waka-readme-stats@main
        with:
          wakatime_api_key: ${{ secrets.WAKATIME_API_KEY }}
          github_token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          github_repository: ${{ github.repository }}
          readme_path: README.md

          # Use a longer period for more meaningful statistics
          stats_range: last_30_days
          timezone: Africa/Johannesburg

          # Only show the languages configured in the action whitelist
          languages_limit: all
          languages_source: both

          show_code_time: "true"
          show_ai_time: "false"
          show_languages: "true"
          show_editors: "false"
          show_os: "false"
          show_projects: "false"
